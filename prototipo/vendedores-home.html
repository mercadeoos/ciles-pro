<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23001489'/><text x='50' y='70' font-size='58' text-anchor='middle'>%E2%9A%A1</text></svg>">
<title>Inicio — CILES PRO Vendedores</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="vendedores">

<div class="phone-wrap">
<div class="phone-shell">
  <div class="phone-scroll" id="scroll">

    <div class="app-topbar">
      <div class="app-row">
        <img src="assets/img/logo-ciles-icono.png" alt="CILES" style="width:30px; height:30px;">
        <div>
          <div class="app-muted" id="fecha-hoy"></div>
          <h1 class="app-h2" id="saludo" style="margin-top:2px;">Hola 👋</h1>
        </div>
      </div>
      <a href="vendedores-perfil.html" class="app-avatar" id="avatar">V</a>
    </div>

    <div class="streak-card" style="margin-top:18px;">
      <div class="streak-flame">🔥</div>
      <div>
        <div class="streak-n"><span id="racha-n">1</span> día<span id="racha-plural"></span> de racha</div>
        <div class="streak-l"><span id="xp-total">0</span> XP acumulados de <span id="xp-programa"></span></div>
      </div>
    </div>

    <div id="hoy-toca"></div>

    <div style="margin-top:26px;">
      <div class="app-row-between">
        <h2 class="app-h2">Tu camino</h2>
        <a href="vendedores-progreso.html" class="app-muted" style="font-weight:700;">Ver progreso →</a>
      </div>
      <div id="niveles-list" style="margin-top:12px;"></div>
    </div>

    <a href="vendedores-diccionario.html" class="app-card" style="margin-top:22px; display:flex; align-items:center; gap:12px;">
      <span class="blob-icon size-sm" id="ic-diccionario"></span>
      <div style="flex:1;">
        <div style="font-weight:800; font-size:13.5px; color:var(--navy-950);">Diccionario eléctrico</div>
        <div class="app-muted">Palabras y conceptos del oficio, a la mano</div>
      </div>
      <span class="app-muted">→</span>
    </a>

  </div>
  <div id="tabbar-slot"></div>
</div>
</div>

<script src="assets/js/data-vendedores.js"></script>
<script src="assets/js/iconos.js"></script>
<script src="assets/js/main.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-vendedor.js"></script>
<script src="assets/js/app-vendedor.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  if(await requiereOnboardingVendedor()) return;
  const e = getEstadoVendedor();

  document.getElementById("tabbar-slot").innerHTML = renderTabbarVendedor("inicio");
  document.getElementById("avatar").textContent = iniciales(e.nombre);
  document.getElementById("saludo").textContent = `Hola, ${e.nombre.split(" ")[0] || "vendedor"} 👋`;
  document.getElementById("fecha-hoy").textContent = new Date().toLocaleDateString("es-CO", {weekday:"long", day:"numeric", month:"long"});
  document.getElementById("racha-n").textContent = e.racha;
  document.getElementById("racha-plural").textContent = e.racha === 1 ? "" : "s";
  document.getElementById("xp-total").textContent = e.xp.toLocaleString("es-CO");
  document.getElementById("xp-programa").textContent = PROGRAMA_VENDEDORES.xpTotal.toLocaleString("es-CO") + " XP";

  const siguiente = siguienteModuloVendedorPendiente();
  const hoyToca = document.getElementById("hoy-toca");
  if(siguiente){
    hoyToca.innerHTML = `
      <div class="app-card" style="margin-top:16px;">
        <div class="app-eyebrow">Hoy toca</div>
        <div class="app-row" style="margin-top:10px;">
          <span class="blob-icon size-md">${blobIcon(siguiente.icono, siguiente.nivelColor.replace("acc-",""))}</span>
          <div>
            <div style="font-weight:800; color:var(--navy-950);">${siguiente.nombre}</div>
            <div class="app-muted">${siguiente.nivelNombre} · ${siguiente.duracion} · +${siguiente.gamificacion.xp} XP</div>
          </div>
        </div>
        <a href="vendedores-leccion.html?m=${encodeURIComponent(siguiente.id)}" class="app-btn app-btn-primary" style="margin-top:16px;">Empezar módulo ${siguiente.id} →</a>
      </div>`;
  } else {
    hoyToca.innerHTML = `
      <div class="app-card app-card-navy" style="margin-top:16px; text-align:center;">
        <div style="font-size:34px;">🏆</div>
        <div style="font-weight:800; margin-top:6px;">¡Completaste el programa CILES Pro!</div>
        <div class="app-muted" style="color:rgba(255,255,255,.75); margin-top:4px;">Certificación "Vendedor CILES Pro" desbloqueada.</div>
      </div>`;
  }

  document.getElementById("niveles-list").innerHTML = NIVELES_VENDEDOR.map(n => {
    const prog = progresoNivelVendedor(n);
    return `<a href="vendedores-progreso.html#${n.slug}" class="nivel-row">
      <div class="nivel-row-badge ${n.color}-bg">${n.id}</div>
      <div style="flex:1;">
        <div style="font-weight:800; font-size:13.5px; color:var(--navy-950);">${n.nombre}</div>
        <div class="app-progress-track" style="margin-top:6px;"><div class="app-progress-fill" style="width:${prog.pct}%; background:var(--${n.color});"></div></div>
      </div>
      <div class="app-muted" style="font-weight:700;">${prog.hechos}/${prog.total}</div>
    </a>`;
  }).join("");

  document.getElementById("ic-diccionario").innerHTML = blobIcon("plano", "gold");
});
</script>
</body>
</html>
