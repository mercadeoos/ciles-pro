<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23001489'/><text x='50' y='70' font-size='58' text-anchor='middle'>%E2%9A%A1</text></svg>">
<title>Catálogo — CILES PRO Vendedores</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="vendedores">

<div class="phone-wrap">
<div class="phone-shell">
  <div class="phone-scroll no-tabbar" id="scroll">

    <a href="vendedores-perfil.html" class="app-muted" style="font-weight:700;">← Perfil</a>
    <span class="app-eyebrow" style="display:block; margin-top:14px;">Recurso de consulta</span>
    <h1 class="app-h1">Catálogo CILES</h1>
    <p class="app-lede">Desliza entre productos, mira la ficha y toca las pestañas para ver normas, características y más.</p>

    <input id="buscar" class="app-input" style="margin-top:16px;" placeholder="Buscar producto…">
    <div id="filtro-cat" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;"></div>

    <div id="zona-tarjeta" style="margin-top:16px;"></div>
    <p id="sin-resultados" class="app-muted hidden" style="text-align:center; margin-top:16px;">No se encontraron productos con ese criterio.</p>

  </div>
</div>
</div>

<div class="cat-lightbox" id="lightbox" hidden>
  <button class="cat-lightbox-close" id="lightbox-close" aria-label="Cerrar"></button>
  <div class="cat-lightbox-body" id="lightbox-body"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="assets/js/cartilla-vendedores.js"></script>
<script src="assets/js/iconos.js"></script>
<script src="assets/js/main.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-vendedor.js"></script>
<script src="assets/js/app-vendedor.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const CAT_ICONO = {
  "Breakers":["proteccion","coral"], "Tableros":["tablero","teal"], "Cajas y protección":["proteccion","purple"],
  "Suichería":["interruptor","gold"], "Sensores y detectores":["sensor","coral"], "Plafones":["bombilla","gold"],
  "Tomacorrientes":["tomacorriente","teal"], "Conectores y accesorios":["cable","purple"],
};

const SECCIONES = [
  {key:"normas", label:"Normas"},
  {key:"caracteristicas", label:"Características"},
  {key:"diferencia", label:"Nos diferencia"},
  {key:"dondeUsarlo", label:"Dónde usarlo"},
  {key:"tipos", label:"Tipos"},
  {key:"tenPresente", label:"Ten presente"},
];

let pdfCartilla = null;
const cachePaginas = {};
let listaActual = [];
let posActual = 0;
let tabActiva = 0;

function getPdfCartilla(){
  if(!pdfCartilla) pdfCartilla = pdfjsLib.getDocument("assets/docs/cartilla-vendedor.pdf").promise;
  return pdfCartilla;
}

async function renderPaginaCartilla(pagina, escala){
  const key = pagina + "@" + escala;
  if(cachePaginas[key]) return cachePaginas[key];
  const pdf = await getPdfCartilla();
  const page = await pdf.getPage(pagina);
  const viewport = page.getViewport({scale: escala});
  const canvas = document.createElement("canvas");
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({canvasContext: canvas.getContext("2d"), viewport}).promise;
  const dataUrl = canvas.toDataURL("image/jpeg", 0.88);
  cachePaginas[key] = dataUrl;
  return dataUrl;
}

function abrirLightbox(pagina, nombre){
  const body = document.getElementById("lightbox-body");
  body.innerHTML = `<div class="cat-lightbox-loading">Cargando ficha…</div>`;
  document.getElementById("lightbox").hidden = false;
  renderPaginaCartilla(pagina, 2.4).then(url => {
    body.innerHTML = `<img src="${url}" alt="Ficha técnica: ${nombre}">`;
  }).catch(() => {
    body.innerHTML = `<p class="app-muted" style="color:#fff; text-align:center; padding:30px;">No se pudo cargar la ficha.</p>`;
  });
}
function cerrarLightbox(){ document.getElementById("lightbox").hidden = true; }

function renderTarjeta(){
  const zona = document.getElementById("zona-tarjeta");
  document.getElementById("sin-resultados").classList.toggle("hidden", listaActual.length > 0);

  if(!listaActual.length){ zona.innerHTML = ""; return; }
  const p = listaActual[posActual];
  const [tipo, color] = CAT_ICONO[p.cat] || ["tablero", "navy"];
  const secciones = SECCIONES.filter(s => p[s.key]);

  zona.innerHTML = `
    <div class="app-card cat-deck-card">
      <div class="cat-deck-head">
        <span class="blob-icon size-sm">${blobIcon(tipo, color)}</span>
        <div style="flex:1;">
          <span class="badge" style="background:var(--acc-${color}-soft, var(--acc-teal-soft)); color:var(--navy-950);">${p.cat}</span>
          <div class="cat-card-title" style="margin-top:6px;">${p.nombre}</div>
        </div>
      </div>

      <div class="cat-thumb-wrap" id="thumb-wrap">
        <img class="cat-thumb" id="thumb-img" alt="Ficha técnica: ${p.nombre}">
        <span class="cat-img-zoom">${uiIcon("buscar", 14)} Ampliar</span>
      </div>

      <div class="cat-tabs" id="tabs-row">
        ${secciones.map((s, i) => `<button class="cat-tab${i === tabActiva ? " active" : ""}" data-i="${i}">${s.label}</button>`).join("")}
      </div>
      <div class="cat-tab-content" id="tab-content">
        <div class="cat-sec-text">${secciones[tabActiva] ? p[secciones[tabActiva].key] : ""}</div>
      </div>
    </div>

    <div class="cat-deck-nav">
      <button class="cat-deck-btn" id="btn-prev" ${posActual === 0 ? "disabled" : ""}>${uiIcon("chevron", 18).replace('d="m9 6 6 6-6 6"', 'd="m15 6-6 6 6 6"')}</button>
      <span class="cat-deck-count">${posActual + 1} / ${listaActual.length}</span>
      <button class="cat-deck-btn" id="btn-next" ${posActual === listaActual.length - 1 ? "disabled" : ""}>${uiIcon("chevron", 18)}</button>
    </div>

    <div class="cat-dots" id="tira-dots"></div>
  `;

  document.getElementById("tira-dots").innerHTML = listaActual.map((item, i) => {
    const [, c] = CAT_ICONO[item.cat] || ["tablero", "navy"];
    return `<button class="cat-dot${i === posActual ? " active" : ""}" data-i="${i}" style="--dot-color:var(--acc-${c});" aria-label="${item.nombre}"></button>`;
  }).join("");

  const dotActivo = document.querySelector(".cat-dot.active");
  if(dotActivo) dotActivo.scrollIntoView({inline:"center", block:"nearest"});

  const thumb = document.getElementById("thumb-img");
  renderPaginaCartilla(p.pagina, 1.1).then(url => {
    if(listaActual[posActual] !== p) return;
    thumb.src = url;
    thumb.classList.add("loaded");
  });
  const sig = listaActual[posActual + 1];
  if(sig) renderPaginaCartilla(sig.pagina, 1.1).catch(() => {});
}

function irA(pos){
  if(pos < 0 || pos >= listaActual.length) return;
  posActual = pos;
  tabActiva = 0;
  renderTarjeta();
  document.getElementById("scroll").scrollTo({top: 0, behavior:"smooth"});
}

document.addEventListener("DOMContentLoaded", async () => {
  if(await requiereOnboardingVendedor()) return;

  document.getElementById("lightbox-close").innerHTML = uiIcon("cerrar", 22);

  let catActiva = "todas";
  const cats = ["todas", ...Array.from(new Set(CARTILLA_VENDEDOR.map(p => p.cat)))];

  document.getElementById("filtro-cat").innerHTML = cats.map(c => `
    <button class="chip${c === "todas" ? " active" : ""}" data-cat="${c}" aria-pressed="${c === "todas" ? "true" : "false"}">${c === "todas" ? "Todas" : c}</button>`).join("");

  function filtrarYMostrar(mantenerProducto){
    const q = document.getElementById("buscar").value.trim().toLowerCase();
    const anterior = mantenerProducto ? listaActual[posActual] : null;
    listaActual = CARTILLA_VENDEDOR.filter(p => {
      const matchCat = catActiva === "todas" || p.cat === catActiva;
      const matchTexto = !q || [p.nombre, p.cat, p.caracteristicas, p.dondeUsarlo].some(v => v && v.toLowerCase().includes(q));
      return matchCat && matchTexto;
    });
    const idxAnterior = anterior ? listaActual.indexOf(anterior) : -1;
    posActual = idxAnterior >= 0 ? idxAnterior : 0;
    tabActiva = 0;
    renderTarjeta();
  }

  document.getElementById("buscar").addEventListener("input", () => filtrarYMostrar(false));
  document.getElementById("filtro-cat").addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    catActiva = chip.dataset.cat;
    document.querySelectorAll("#filtro-cat .chip").forEach(c => {
      c.classList.toggle("active", c === chip);
      c.setAttribute("aria-pressed", String(c === chip));
    });
    filtrarYMostrar(false);
  });

  document.getElementById("zona-tarjeta").addEventListener("click", e => {
    if(e.target.closest("#thumb-wrap")){
      const p = listaActual[posActual];
      if(p) abrirLightbox(p.pagina, p.nombre);
      return;
    }
    const tab = e.target.closest(".cat-tab");
    if(tab){
      tabActiva = Number(tab.dataset.i);
      renderTarjeta();
      return;
    }
    if(e.target.closest("#btn-prev")){ irA(posActual - 1); return; }
    if(e.target.closest("#btn-next")){ irA(posActual + 1); return; }
    const dot = e.target.closest(".cat-dot");
    if(dot){ irA(Number(dot.dataset.i)); return; }
  });

  document.getElementById("lightbox-close").addEventListener("click", cerrarLightbox);
  document.getElementById("lightbox").addEventListener("click", e => {
    if(e.target.id === "lightbox") cerrarLightbox();
  });
  document.addEventListener("keydown", e => {
    if(!document.getElementById("lightbox").hidden){
      if(e.key === "Escape") cerrarLightbox();
      return;
    }
    if(e.key === "ArrowLeft") irA(posActual - 1);
    if(e.key === "ArrowRight") irA(posActual + 1);
  });

  let touchX = null;
  document.getElementById("zona-tarjeta").addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, {passive:true});
  document.getElementById("zona-tarjeta").addEventListener("touchend", e => {
    if(touchX === null) return;
    const delta = e.changedTouches[0].clientX - touchX;
    if(Math.abs(delta) > 70) irA(posActual + (delta < 0 ? 1 : -1));
    touchX = null;
  }, {passive:true});

  filtrarYMostrar(false);
});
</script>
</body>
</html>
