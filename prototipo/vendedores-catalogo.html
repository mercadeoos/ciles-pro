<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23001489'/><text x='50' y='70' font-size='58' text-anchor='middle'>%E2%9A%A1</text></svg>">
<title>Catálogo — CILES PRO Vendedores</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="vendedores">

<div class="phone-wrap">
<div class="phone-shell">
  <div class="phone-scroll no-tabbar" id="scroll">

    <a href="vendedores-perfil.html" class="app-muted" style="font-weight:700;">← Perfil</a>
    <span class="app-eyebrow" style="display:block; margin-top:14px;">Recurso de consulta</span>
    <h1 class="app-h1">Catálogo CILES</h1>
    <p class="app-lede">La cartilla del vendedor, tal cual. Toca un producto para ver su ficha y navega entre productos con las flechas.</p>

    <input id="buscar" class="app-input" style="margin-top:16px;" placeholder="Buscar producto…">
    <div id="filtro-cat" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;"></div>

    <div id="lista" style="margin-top:14px;"></div>
    <p id="sin-resultados" class="app-muted hidden" style="text-align:center; margin-top:16px;">No se encontraron productos con ese criterio.</p>

  </div>
</div>
</div>

<div class="cat-viewer" id="viewer" hidden>
  <div class="cat-viewer-top">
    <button class="cat-viewer-btn" id="viewer-close" aria-label="Cerrar"></button>
    <div class="cat-viewer-top-info">
      <span class="badge" id="viewer-cat"></span>
      <span class="cat-viewer-count" id="viewer-count"></span>
    </div>
  </div>
  <div class="cat-viewer-body" id="viewer-body"></div>
  <div class="cat-viewer-nav">
    <button class="cat-viewer-nav-btn" id="viewer-prev"></button>
    <button class="cat-viewer-nav-btn" id="viewer-next"></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="assets/js/cartilla-vendedores.js"></script>
<script src="assets/js/iconos.js"></script>
<script src="assets/js/main.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-vendedor.js"></script>
<script src="assets/js/app-vendedor.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const CAT_ICONO = {
  "Breakers":["proteccion","coral"], "Tableros":["tablero","teal"], "Cajas y protección":["proteccion","purple"],
  "Suichería":["interruptor","gold"], "Sensores y detectores":["sensor","coral"], "Plafones":["bombilla","gold"],
  "Tomacorrientes":["tomacorriente","teal"], "Conectores y accesorios":["cable","purple"],
};

let pdfCartilla = null;
const cachePaginas = {}; // "pagina@escala" -> dataURL
let listaActual = []; // productos visibles según filtro/búsqueda (orden de navegación)
let posVisor = 0;

function getPdfCartilla(){
  if(!pdfCartilla) pdfCartilla = pdfjsLib.getDocument("assets/docs/cartilla-vendedor.pdf").promise;
  return pdfCartilla;
}

async function renderPaginaCartilla(pagina, escala){
  const key = pagina + "@" + escala;
  if(cachePaginas[key]) return cachePaginas[key];
  const pdf = await getPdfCartilla();
  const page = await pdf.getPage(pagina);
  const viewport = page.getViewport({scale: escala});
  const canvas = document.createElement("canvas");
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({canvasContext: canvas.getContext("2d"), viewport}).promise;
  const dataUrl = canvas.toDataURL("image/jpeg", 0.9);
  cachePaginas[key] = dataUrl;
  return dataUrl;
}

function mostrarEnVisor(pos){
  if(pos < 0 || pos >= listaActual.length) return;
  posVisor = pos;
  const p = listaActual[pos];
  const [, color] = CAT_ICONO[p.cat] || ["tablero", "navy"];

  document.getElementById("viewer-cat").textContent = p.cat;
  document.getElementById("viewer-cat").style.background = `var(--acc-${color}-soft, var(--acc-teal-soft))`;
  document.getElementById("viewer-count").textContent = `${pos + 1} / ${listaActual.length}`;
  document.getElementById("viewer-prev").disabled = pos === 0;
  document.getElementById("viewer-next").disabled = pos === listaActual.length - 1;

  const body = document.getElementById("viewer-body");
  body.innerHTML = `<div class="cat-viewer-loading">Cargando ficha…</div>`;
  body.scrollTop = 0;
  const paginaPedida = p.pagina;
  renderPaginaCartilla(paginaPedida, 2.2).then(url => {
    if(listaActual[posVisor] !== p) return; // el usuario ya navegó a otra
    body.innerHTML = `<img src="${url}" alt="Ficha técnica: ${p.nombre}">`;
  }).catch(() => {
    body.innerHTML = `<p class="app-muted" style="color:#fff; text-align:center; padding:30px;">No se pudo cargar la ficha. Verifica tu conexión e intenta de nuevo.</p>`;
  });

  // precarga silenciosa de la siguiente ficha para navegar sin espera
  const sig = listaActual[pos + 1];
  if(sig) renderPaginaCartilla(sig.pagina, 2.2).catch(() => {});
}

function abrirVisor(lista, pos){
  listaActual = lista;
  document.getElementById("viewer").hidden = false;
  document.body.style.overflow = "hidden";
  mostrarEnVisor(pos);
}

function cerrarVisor(){
  document.getElementById("viewer").hidden = true;
  document.body.style.overflow = "";
}

document.addEventListener("DOMContentLoaded", async () => {
  if(await requiereOnboardingVendedor()) return;

  document.getElementById("viewer-close").innerHTML = uiIcon("cerrar", 22);
  document.getElementById("viewer-prev").innerHTML = uiIcon("chevron", 16).replace('d="m9 6 6 6-6 6"', 'd="m15 6-6 6 6 6"') + " Anterior";
  document.getElementById("viewer-next").innerHTML = "Siguiente " + uiIcon("chevron", 16);

  let catActiva = "todas";
  const cats = ["todas", ...Array.from(new Set(CARTILLA_VENDEDOR.map(p => p.cat)))];

  document.getElementById("filtro-cat").innerHTML = cats.map(c => `
    <button class="chip${c === "todas" ? " active" : ""}" data-cat="${c}" aria-pressed="${c === "todas" ? "true" : "false"}">${c === "todas" ? "Todas" : c}</button>`).join("");

  function filtrar(){
    const q = document.getElementById("buscar").value.trim().toLowerCase();
    return CARTILLA_VENDEDOR.filter(p => {
      const matchCat = catActiva === "todas" || p.cat === catActiva;
      const matchTexto = !q || [p.nombre, p.cat, p.caracteristicas, p.dondeUsarlo].some(v => v && v.toLowerCase().includes(q));
      return matchCat && matchTexto;
    });
  }

  function render(){
    const filtrados = filtrar();

    document.getElementById("lista").innerHTML = filtrados.map((p) => {
      const [tipo, color] = CAT_ICONO[p.cat] || ["tablero", "navy"];
      const idx = CARTILLA_VENDEDOR.indexOf(p);
      return `
      <button class="app-card cat-row" data-idx="${idx}" style="margin-top:10px;">
        <span class="blob-icon size-sm">${blobIcon(tipo, color)}</span>
        <div style="flex:1; text-align:left;">
          <span class="badge" style="background:var(--acc-${color}-soft, var(--acc-teal-soft)); color:var(--navy-950);">${p.cat}</span>
          <div class="cat-card-title" style="margin-top:6px;">${p.nombre}</div>
        </div>
        <span class="cat-chevron">${uiIcon("chevron", 20)}</span>
      </button>`;
    }).join("");

    document.getElementById("sin-resultados").classList.toggle("hidden", filtrados.length > 0);
  }

  document.getElementById("buscar").addEventListener("input", render);
  document.getElementById("filtro-cat").addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    catActiva = chip.dataset.cat;
    document.querySelectorAll("#filtro-cat .chip").forEach(c => {
      c.classList.toggle("active", c === chip);
      c.setAttribute("aria-pressed", String(c === chip));
    });
    render();
  });

  document.getElementById("lista").addEventListener("click", e => {
    const row = e.target.closest(".cat-row");
    if (!row) return;
    const idx = Number(row.dataset.idx);
    const lista = filtrar();
    const pos = lista.findIndex(p => CARTILLA_VENDEDOR.indexOf(p) === idx);
    abrirVisor(lista, pos < 0 ? 0 : pos);
  });

  document.getElementById("viewer-close").addEventListener("click", cerrarVisor);
  document.getElementById("viewer-prev").addEventListener("click", () => mostrarEnVisor(posVisor - 1));
  document.getElementById("viewer-next").addEventListener("click", () => mostrarEnVisor(posVisor + 1));
  document.addEventListener("keydown", e => {
    if(document.getElementById("viewer").hidden) return;
    if(e.key === "Escape") cerrarVisor();
    if(e.key === "ArrowLeft") mostrarEnVisor(posVisor - 1);
    if(e.key === "ArrowRight") mostrarEnVisor(posVisor + 1);
  });

  // swipe táctil sobre la imagen para navegar entre productos
  let touchX = null;
  const viewerBody = document.getElementById("viewer-body");
  viewerBody.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, {passive:true});
  viewerBody.addEventListener("touchend", e => {
    if(touchX === null) return;
    const delta = e.changedTouches[0].clientX - touchX;
    if(Math.abs(delta) > 60) mostrarEnVisor(posVisor + (delta < 0 ? 1 : -1));
    touchX = null;
  }, {passive:true});

  render();
});
</script>
</body>
</html>
