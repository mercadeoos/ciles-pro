<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23001489'/><text x='50' y='70' font-size='58' text-anchor='middle'>%E2%9A%A1</text></svg>">
<title>Catálogo — CILES PRO Vendedores</title>

<link rel="stylesheet" href="assets/css/app.css">

<body data-page="vendedores">

<div class="phone-wrap">
<div class="phone-shell">
  <div class="phone-scroll no-tabbar" id="scroll">

    <a href="vendedores-perfil.html" class="app-muted" style="font-weight:700;">← Perfil</a>
    <span class="app-eyebrow" style="display:block; margin-top:14px;">Recurso de consulta</span>
    <h1 class="app-h1">Catálogo CILES</h1>
    <p class="app-lede">La cartilla completa, como un libro: pasa la página tocando o deslizando, o busca un producto para ir directo a su ficha.</p>

    <div style="position:relative; margin-top:16px;">
      <input id="buscar" class="app-input" placeholder="Buscar producto…" autocomplete="off">
      <div id="resultados" class="cat-search-results hidden"></div>
    </div>
    <div id="filtro-cat" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;"></div>

    <div id="libro-estado" class="app-muted" style="text-align:center; margin-top:18px;"></div>
    <div id="libro-wrap" class="cat-book-wrap" hidden>
      <div id="book"></div>
    </div>

    <div class="cat-deck-nav" id="nav-libro" hidden>
      <button class="cat-deck-btn" id="btn-prev" aria-label="Página anterior"></button>
      <button class="cat-deck-btn cat-deck-btn-zoom" id="btn-zoom" aria-label="Ampliar página"></button>
      <span class="cat-deck-count" id="contador-pagina"></span>
      <button class="cat-deck-btn" id="btn-next" aria-label="Página siguiente"></button>
    </div>

  </div>
</div>
</div>

<div class="cat-lightbox" id="lightbox" hidden>
  <button class="cat-lightbox-close" id="lightbox-close" aria-label="Cerrar"></button>
  <div class="cat-lightbox-hint" id="lightbox-hint">Pellizca o usa la rueda del mouse para acercar · arrastra para mover · doble toque para restablecer</div>
  <div class="cat-lightbox-body" id="lightbox-body"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script src="assets/js/cartilla-vendedores.js"></script>
<script src="assets/js/iconos.js"></script>
<script src="assets/js/main.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-vendedor.js"></script>
<script src="assets/js/app-vendedor.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const TOTAL_PAGINAS = 43;
const RATIO = 792 / 612; // alto/ancho de una página de la cartilla (carta)
let libro = null;
let paginasCache = new Array(TOTAL_PAGINAS + 1); // 1-indexado, dataURL por página
let paginasListas = 0;

function paginaPlaceholder(){
  const w = 340, h = Math.round(w * RATIO);
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#f3efe7";
  ctx.fillRect(0, 0, w, h);
  return canvas.toDataURL("image/png");
}

async function cargarLibro(){
  const estado = document.getElementById("libro-estado");
  const placeholder = paginaPlaceholder();
  const urls = new Array(TOTAL_PAGINAS).fill(placeholder);

  document.getElementById("libro-wrap").hidden = false;
  document.getElementById("nav-libro").hidden = false;
  libro = new St.PageFlip(document.getElementById("book"), {
    width: 340, height: Math.round(340 * RATIO),
    size: "stretch",
    minWidth: 220, maxWidth: 480,
    minHeight: Math.round(220 * RATIO), maxHeight: Math.round(480 * RATIO),
    showCover: true,
    mobileScrollSupport: false,
    useMouseEvents: true,
    maxShadowOpacity: 0.4,
  });
  libro.loadFromImages(urls);
  libro.on("flip", actualizarContador);
  actualizarContador();

  const pdf = await pdfjsLib.getDocument("assets/docs/cartilla-vendedor.pdf").promise;
  for(let n = 1; n <= TOTAL_PAGINAS; n++){
    const page = await pdf.getPage(n);
    const viewport = page.getViewport({scale: 1.15});
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({canvasContext: canvas.getContext("2d"), viewport}).promise;
    paginasCache[n] = canvas.toDataURL("image/jpeg", 0.85);
    paginasListas++;
    urls[n - 1] = paginasCache[n];
    if(paginasListas % 4 === 0 || paginasListas === TOTAL_PAGINAS){
      libro.updateFromImages(urls.slice());
    }
    estado.textContent = paginasListas < TOTAL_PAGINAS ? `Preparando tu libro… ${paginasListas}/${TOTAL_PAGINAS}` : "";
  }
}

function actualizarContador(){
  if(!libro) return;
  document.getElementById("contador-pagina").textContent = `${libro.getCurrentPageIndex() + 1} / ${libro.getPageCount()}`;
}

function irAPagina(pagina){
  if(!libro) return;
  libro.turnToPage(pagina - 1);
  document.getElementById("resultados").classList.add("hidden");
  document.getElementById("scroll").scrollTo({top: 0, behavior:"smooth"});
}

async function ampliarPaginaActual(){
  if(!libro) return;
  const idx = libro.getCurrentPageIndex() + 1;
  const body = document.getElementById("lightbox-body");
  body.innerHTML = `<div class="cat-lightbox-loading">Cargando ficha…</div>`;
  document.getElementById("lightbox").hidden = false;
  document.getElementById("lightbox-hint").classList.remove("fade-out");
  try{
    const pdf = await pdfjsLib.getDocument("assets/docs/cartilla-vendedor.pdf").promise;
    const page = await pdf.getPage(idx);
    const viewport = page.getViewport({scale: 2.6});
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({canvasContext: canvas.getContext("2d"), viewport}).promise;
    body.innerHTML = `<img src="${canvas.toDataURL("image/jpeg", 0.92)}" alt="Página ${idx} de la cartilla" id="lightbox-img">`;
    iniciarZoomPan();
  }catch(e){
    body.innerHTML = `<p class="app-muted" style="color:#fff; text-align:center; padding:30px;">No se pudo ampliar la página.</p>`;
  }
}
function cerrarLightbox(){ document.getElementById("lightbox").hidden = true; }

/* ---- Zoom + paneo real sobre la imagen ampliada: pellizcar, rueda del
   mouse y arrastrar, para inspeccionar cualquier parte de la ficha. ---- */
let zoomEstado = null;
function iniciarZoomPan(){
  const img = document.getElementById("lightbox-img");
  if(!img) return;
  zoomEstado = {scale:1, tx:0, ty:0, panX:0, panY:0, panActivo:false, pinchDist:0, pinchScale:1};
  aplicarTransformZoom(img);

  setTimeout(() => document.getElementById("lightbox-hint").classList.add("fade-out"), 2600);

  img.onwheel = e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.2 : 1/1.2;
    cambiarEscala(img, zoomEstado.scale * factor);
  };
  img.onmousedown = e => {
    if(zoomEstado.scale <= 1) return;
    e.preventDefault();
    zoomEstado.panActivo = true;
    zoomEstado.panX = e.clientX - zoomEstado.tx;
    zoomEstado.panY = e.clientY - zoomEstado.ty;
    img.style.cursor = "grabbing";
  };
  img.ondblclick = () => cambiarEscala(img, zoomEstado.scale > 1 ? 1 : 2.5);

  img.ontouchstart = e => {
    if(e.touches.length === 2){
      zoomEstado.pinchDist = distanciaToques(e.touches);
      zoomEstado.pinchScale = zoomEstado.scale;
    } else if(e.touches.length === 1 && zoomEstado.scale > 1){
      zoomEstado.panActivo = true;
      zoomEstado.panX = e.touches[0].clientX - zoomEstado.tx;
      zoomEstado.panY = e.touches[0].clientY - zoomEstado.ty;
    }
  };
  img.ontouchmove = e => {
    e.preventDefault();
    if(e.touches.length === 2){
      const dist = distanciaToques(e.touches);
      cambiarEscala(img, zoomEstado.pinchScale * (dist / zoomEstado.pinchDist), false);
    } else if(e.touches.length === 1 && zoomEstado.panActivo){
      zoomEstado.tx = e.touches[0].clientX - zoomEstado.panX;
      zoomEstado.ty = e.touches[0].clientY - zoomEstado.panY;
      aplicarTransformZoom(img);
    }
  };
  img.ontouchend = () => { zoomEstado.panActivo = false; };
}

function distanciaToques(touches){
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}

function cambiarEscala(img, nuevaEscala, limitarPan){
  zoomEstado.scale = Math.min(4, Math.max(1, nuevaEscala));
  if(zoomEstado.scale === 1){ zoomEstado.tx = 0; zoomEstado.ty = 0; }
  img.style.cursor = zoomEstado.scale > 1 ? "grab" : "zoom-in";
  aplicarTransformZoom(img);
}

function aplicarTransformZoom(img){
  img.style.transform = `translate(${zoomEstado.tx}px, ${zoomEstado.ty}px) scale(${zoomEstado.scale})`;
}

document.addEventListener("DOMContentLoaded", async () => {
  if(await requiereOnboardingVendedor()) return;

  document.getElementById("btn-prev").innerHTML = uiIcon("chevron", 18).replace('d="m9 6 6 6-6 6"', 'd="m15 6-6 6 6 6"');
  document.getElementById("btn-next").innerHTML = uiIcon("chevron", 18);
  document.getElementById("btn-zoom").innerHTML = uiIcon("buscar", 18);
  document.getElementById("lightbox-close").innerHTML = uiIcon("cerrar", 22);

  let catActiva = "todas";
  const cats = ["todas", ...Array.from(new Set(CARTILLA_VENDEDOR.map(p => p.cat)))];
  document.getElementById("filtro-cat").innerHTML = cats.map(c => `
    <button class="chip${c === "todas" ? " active" : ""}" data-cat="${c}" aria-pressed="${c === "todas" ? "true" : "false"}">${c === "todas" ? "Todas" : c}</button>`).join("");

  function mostrarResultados(){
    const q = document.getElementById("buscar").value.trim().toLowerCase();
    const activoBusqueda = q.length > 0;
    const activoCategoria = catActiva !== "todas";
    const resultadosEl = document.getElementById("resultados");
    if(!activoBusqueda && !activoCategoria){ resultadosEl.classList.add("hidden"); resultadosEl.innerHTML = ""; return; }

    const filtrados = CARTILLA_VENDEDOR.filter(p => {
      const matchCat = !activoCategoria || p.cat === catActiva;
      const matchTexto = !activoBusqueda || [p.nombre, p.cat, p.caracteristicas, p.dondeUsarlo].some(v => v && v.toLowerCase().includes(q));
      return matchCat && matchTexto;
    });

    resultadosEl.classList.remove("hidden");
    resultadosEl.innerHTML = filtrados.length
      ? filtrados.map(p => `<button class="cat-search-row" data-pagina="${p.pagina}">
          <span class="badge">${p.cat}</span>
          <span class="cat-search-row-title">${p.nombre}</span>
        </button>`).join("")
      : `<p class="app-muted" style="padding:14px;">No se encontraron productos.</p>`;
  }

  document.getElementById("buscar").addEventListener("input", mostrarResultados);
  document.getElementById("filtro-cat").addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    catActiva = chip.dataset.cat;
    document.querySelectorAll("#filtro-cat .chip").forEach(c => {
      c.classList.toggle("active", c === chip);
      c.setAttribute("aria-pressed", String(c === chip));
    });
    mostrarResultados();
  });
  document.getElementById("resultados").addEventListener("click", e => {
    const row = e.target.closest(".cat-search-row");
    if(!row) return;
    irAPagina(Number(row.dataset.pagina));
  });

  document.getElementById("btn-prev").addEventListener("click", () => libro && libro.flipPrev());
  document.getElementById("btn-next").addEventListener("click", () => libro && libro.flipNext());
  document.getElementById("btn-zoom").addEventListener("click", ampliarPaginaActual);
  document.getElementById("lightbox-close").addEventListener("click", cerrarLightbox);
  document.getElementById("lightbox").addEventListener("click", e => { if(e.target.id === "lightbox") cerrarLightbox(); });
  window.addEventListener("mousemove", e => {
    if(!zoomEstado || !zoomEstado.panActivo) return;
    const img = document.getElementById("lightbox-img");
    if(!img) return;
    zoomEstado.tx = e.clientX - zoomEstado.panX;
    zoomEstado.ty = e.clientY - zoomEstado.panY;
    aplicarTransformZoom(img);
  });
  window.addEventListener("mouseup", () => {
    if(!zoomEstado) return;
    zoomEstado.panActivo = false;
    const img = document.getElementById("lightbox-img");
    if(img) img.style.cursor = zoomEstado.scale > 1 ? "grab" : "zoom-in";
  });
  document.addEventListener("keydown", e => {
    if(!document.getElementById("lightbox").hidden){ if(e.key === "Escape") cerrarLightbox(); return; }
    if(e.key === "ArrowLeft" && libro) libro.flipPrev();
    if(e.key === "ArrowRight" && libro) libro.flipNext();
  });

  cargarLibro();
});
</script>
</body>
</html>
