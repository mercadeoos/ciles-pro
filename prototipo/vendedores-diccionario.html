<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23001489'/><text x='50' y='70' font-size='58' text-anchor='middle'>%E2%9A%A1</text></svg>">
<title>Diccionario — CILES PRO Vendedores</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="vendedores">

<div class="phone-wrap">
<div class="phone-shell">
  <div class="phone-scroll no-tabbar" id="scroll">

    <a href="vendedores-perfil.html" class="app-muted" style="font-weight:700;">← Perfil</a>
    <span class="app-eyebrow" style="display:block; margin-top:14px;">Recurso de consulta</span>
    <h1 class="app-h1">Diccionario eléctrico</h1>
    <p class="app-lede">Palabras y conceptos del oficio, explicados simple, para que los tengas a mano frente al cliente.</p>

    <input id="buscar" class="app-input" style="margin-top:16px;" placeholder="Buscar palabra o concepto…">
    <div id="filtro-cat" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;"></div>

    <div id="lista" style="margin-top:14px;"></div>
    <p id="sin-resultados" class="app-muted hidden" style="text-align:center; margin-top:16px;">No se encontraron términos con ese criterio.</p>

  </div>
</div>
</div>

<script src="assets/js/diccionario-vendedores.js"></script>
<script src="assets/js/main.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-vendedor.js"></script>
<script src="assets/js/app-vendedor.js"></script>
<script>
const CAT_COLOR = {
  "Fundamentos":"acc-purple", "Cableado":"acc-coral", "Protección":"acc-teal",
  "Tableros":"acc-teal", "Redes":"acc-gold", "Normatividad":"acc-gold",
};

document.addEventListener("DOMContentLoaded", async () => {
  if(await requiereOnboardingVendedor()) return;

  let catActiva = "todas";
  const cats = ["todas", ...Array.from(new Set(DICCIONARIO_VENDEDOR.map(g => g.cat)))];

  document.getElementById("filtro-cat").innerHTML = cats.map(c => `
    <button class="chip${c === "todas" ? " active" : ""}" data-cat="${c}" aria-pressed="${c === "todas" ? "true" : "false"}">${c === "todas" ? "Todas" : c}</button>`).join("");

  function render(){
    const q = document.getElementById("buscar").value.trim().toLowerCase();
    const filtrados = DICCIONARIO_VENDEDOR.filter(g => {
      const matchCat = catActiva === "todas" || g.cat === catActiva;
      const matchTexto = !q || [g.t, g.cat, g.d].some(v => v.toLowerCase().includes(q));
      return matchCat && matchTexto;
    });

    document.getElementById("lista").innerHTML = filtrados.map(g => `
      <div class="app-card" style="margin-top:10px;">
        <span class="badge" style="background:var(--${CAT_COLOR[g.cat]}-soft); color:var(--navy-950);">${g.cat}</span>
        <h4 style="font-size:14.5px; color:var(--navy-950); font-weight:800;" class="mt-8">${g.t}</h4>
        <p class="app-muted mt-8">${g.d}</p>
      </div>`).join("");

    document.getElementById("sin-resultados").classList.toggle("hidden", filtrados.length > 0);
  }

  document.getElementById("buscar").addEventListener("input", render);
  document.getElementById("filtro-cat").addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    catActiva = chip.dataset.cat;
    document.querySelectorAll("#filtro-cat .chip").forEach(c => {
      c.classList.toggle("active", c === chip);
      c.setAttribute("aria-pressed", String(c === chip));
    });
    render();
  });

  render();
});
</script>
</body>
</html>
