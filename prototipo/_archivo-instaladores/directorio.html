<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23141b52'/><text x='50' y='70' font-size='58' text-anchor='middle'>%E2%9A%A1</text></svg>">
<title>Directorio — CILES PRO</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-page="directorio">

<div class="phone-wrap">
<div class="phone-shell">
  <div class="phone-scroll no-tabbar" id="scroll">

    <a href="universo.html" class="app-muted" style="font-weight:700;">← Inicio</a>
    <span class="app-eyebrow" style="display:block; margin-top:14px;">Directorio nacional</span>
    <h1 class="app-h1">Profesionales certificados CILES PRO</h1>
    <p class="app-lede">Visibilidad para instaladores, técnicos e ingenieros certificados en todo el país.</p>

    <input id="buscar" class="app-input" style="margin-top:16px;" placeholder="Buscar por nombre, ciudad o especialidad…">
    <div id="filtro-nivel" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;"></div>

    <div id="directorio-lista" style="margin-top:14px;"></div>
    <p id="sin-resultados" class="app-muted hidden" style="text-align:center; margin-top:16px;">No se encontraron profesionales con ese criterio.</p>

  </div>
</div>
</div>

<script src="data.js"></script>
<script src="../assets/js/iconos.js"></script>
<script src="../assets/js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  let nivelActivo = "todos";
  const niveles = ["todos", ...NIVELES.map(n => n.id)];

  document.getElementById("filtro-nivel").innerHTML = niveles.map(n => `
    <button class="chip${n === "todos" ? " active" : ""}" data-nivel="${n}" aria-pressed="${n === "todos" ? "true" : "false"}">
      ${n === "todos" ? "Todos" : NIVELES.find(x => x.id === n).nombre}
    </button>`).join("");

  function render(){
    const q = document.getElementById("buscar").value.trim().toLowerCase();
    const filtrados = DIRECTORIO.filter(p => {
      const matchNivel = nivelActivo === "todos" || p.nivel === nivelActivo;
      const matchTexto = !q || [p.nombre, p.ciudad, p.especialidad].some(v => v.toLowerCase().includes(q));
      return matchNivel && matchTexto;
    }).sort((a,b) => b.pts - a.pts);

    document.getElementById("directorio-lista").innerHTML = filtrados.map(p => `
      <div class="nivel-row">
        <div class="nivel-row-badge acc-teal-bg" style="width:40px;height:40px;font-size:13px;">${p.nombre.split(" ").map(w=>w[0]).slice(0,2).join("")}</div>
        <div style="flex:1;">
          <div style="font-weight:800; font-size:13px; color:var(--navy-950);">${p.nombre}</div>
          <div class="app-muted">${p.ciudad} · ${p.especialidad}</div>
        </div>
        <div style="text-align:right;">
          <div class="badge badge-navy" style="font-size:10.5px;">${p.nivelNombre}</div>
          <div class="app-muted" style="margin-top:4px;">${p.pts.toLocaleString("es-CO")} pts</div>
        </div>
      </div>`).join("");

    document.getElementById("sin-resultados").classList.toggle("hidden", filtrados.length > 0);
  }

  document.getElementById("buscar").addEventListener("input", render);
  document.getElementById("filtro-nivel").addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    nivelActivo = chip.dataset.nivel === "todos" ? "todos" : Number(chip.dataset.nivel);
    document.querySelectorAll("#filtro-nivel .chip").forEach(c => {
      c.classList.toggle("active", c === chip);
      c.setAttribute("aria-pressed", String(c === chip));
    });
    render();
  });

  render();
});
</script>
</body>
</html>
