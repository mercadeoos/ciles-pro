<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23141b52'/><text x='50' y='70' font-size='58' text-anchor='middle'>%E2%9A%A1</text></svg>">
<title>Biblioteca — CILES PRO</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-page="biblioteca">

<div class="phone-wrap">
<div class="phone-shell">
  <div class="phone-scroll no-tabbar" id="scroll">

    <a href="universo.html" class="app-muted" style="font-weight:700;">← Inicio</a>
    <span class="app-eyebrow" style="display:block; margin-top:14px;">Biblioteca técnica</span>
    <h1 class="app-h1">Glosario RETIE y herramientas técnicas</h1>
    <p class="app-lede">Consulta rápida de términos normativos y de producto para resolver dudas en obra o en oficina.</p>

    <input id="buscar" class="app-input" style="margin-top:16px;" placeholder="Buscar término, sigla o categoría…">
    <div id="filtro-cat" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;"></div>

    <div id="glosario" style="margin-top:14px;"></div>
    <p id="sin-resultados" class="app-muted hidden" style="text-align:center; margin-top:16px;">No se encontraron términos con ese criterio.</p>

  </div>
</div>
</div>

<script src="data.js"></script>
<script src="../assets/js/iconos.js"></script>
<script src="../assets/js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  let catActiva = "todas";
  const cats = ["todas", ...Array.from(new Set(GLOSARIO.map(g => g.cat)))];

  document.getElementById("filtro-cat").innerHTML = cats.map(c => `
    <button class="chip${c === "todas" ? " active" : ""}" data-cat="${c}" aria-pressed="${c === "todas" ? "true" : "false"}">${c === "todas" ? "Todas" : c}</button>`).join("");

  function render(){
    const q = document.getElementById("buscar").value.trim().toLowerCase();
    const filtrados = GLOSARIO.filter(g => {
      const matchCat = catActiva === "todas" || g.cat === catActiva;
      const matchTexto = !q || [g.t, g.sigla, g.cat, ...g.tags].some(v => v.toLowerCase().includes(q));
      return matchCat && matchTexto;
    });

    document.getElementById("glosario").innerHTML = filtrados.map(g => `
      <div class="app-card" style="margin-top:10px;">
        <div class="app-row-between">
          <span class="badge badge-navy">${g.cat}</span>
          ${g.sigla !== "—" ? `<span class="app-muted">${g.sigla}</span>` : ""}
        </div>
        <h4 style="font-size:14px; color:var(--navy-950);" class="mt-8">${g.t}</h4>
        <p class="app-muted mt-8">${g.d}</p>
        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;">
          ${g.tags.map(tag => `<span class="badge badge-outline">${tag}</span>`).join("")}
        </div>
      </div>`).join("");

    document.getElementById("sin-resultados").classList.toggle("hidden", filtrados.length > 0);
  }

  document.getElementById("buscar").addEventListener("input", render);
  document.getElementById("filtro-cat").addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    catActiva = chip.dataset.cat;
    document.querySelectorAll("#filtro-cat .chip").forEach(c => {
      c.classList.toggle("active", c === chip);
      c.setAttribute("aria-pressed", String(c === chip));
    });
    render();
  });

  render();
});
</script>
</body>
</html>
