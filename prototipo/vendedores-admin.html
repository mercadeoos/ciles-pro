<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23001489'/><text x='50' y='70' font-size='58' text-anchor='middle'>%E2%9A%A1</text></svg>">
<title>Panel admin — CILES PRO Vendedores</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="vendedores">

<div class="phone-wrap">
<div class="phone-shell">
  <div class="phone-scroll no-tabbar" id="scroll">

    <a href="vendedores-perfil.html" class="app-muted" style="font-weight:700;">← Perfil</a>
    <span class="app-eyebrow" style="display:block; margin-top:14px;">Solo administradores</span>
    <h1 class="app-h1">Panel de asesores CILES Pro</h1>
    <p class="app-lede" id="resumen-total">Cargando…</p>

    <div class="kpi-row" style="margin-top:18px;">
      <div class="kpi-card"><div class="kpi-n" id="kpi-total">—</div><div class="kpi-l">Asesores</div></div>
      <div class="kpi-card"><div class="kpi-n" id="kpi-ciudad-lider">—</div><div class="kpi-l">Ciudad líder</div></div>
      <div class="kpi-card"><div class="kpi-n" id="kpi-xp-prom">—</div><div class="kpi-l">XP promedio</div></div>
      <div class="kpi-card"><div class="kpi-n" id="kpi-modulos">—</div><div class="kpi-l">Módulos completados</div></div>
    </div>

    <div style="margin-top:26px;">
      <h2 class="app-h2">Registros por ciudad</h2>
      <div id="lista-ciudades" style="margin-top:10px;"></div>
    </div>

    <div style="margin-top:26px;">
      <div class="app-row-between">
        <h2 class="app-h2">Todos los asesores</h2>
      </div>
      <input id="buscar-asesor" class="app-input" style="margin-top:10px;" placeholder="Buscar por nombre o ciudad…">
      <div id="lista-asesores" style="margin-top:10px;"></div>
    </div>

  </div>
</div>
</div>

<script src="assets/js/data-vendedores.js"></script>
<script src="assets/js/iconos.js"></script>
<script src="assets/js/main.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-vendedor.js"></script>
<script src="assets/js/app-vendedor.js"></script>
<script>
const COLORES_BARRA = ["acc-coral", "acc-teal", "acc-purple", "acc-gold"];
const MEDALLAS = ["gold", "silver", "bronze"];
let TODOS_ASESORES = [];

document.addEventListener("DOMContentLoaded", async () => {
  mostrarCargaVendedor();
  const user = await esperarAuthVendedor();
  if(!user || !esAdminCilesPro(user.email)){
    location.href = "vendedores-home.html";
    return;
  }

  try{
    const snap = await fbDb.collection("vendedores").get();
    TODOS_ASESORES = snap.docs.map(d => d.data());

    document.getElementById("resumen-total").textContent =
      `${TODOS_ASESORES.length} asesor${TODOS_ASESORES.length === 1 ? "" : "es"} registrados en total.`;

    const porCiudad = {};
    let xpTotal = 0, modulosTotal = 0;
    TODOS_ASESORES.forEach(v => {
      const c = (v.ciudad || "").trim() || "Sin ciudad";
      porCiudad[c] = (porCiudad[c] || 0) + 1;
      xpTotal += v.xp || 0;
      modulosTotal += (v.completados || []).length;
    });
    const ciudadesOrdenadas = Object.entries(porCiudad).sort((a,b) => b[1] - a[1]);
    const max = ciudadesOrdenadas.length ? ciudadesOrdenadas[0][1] : 1;

    document.getElementById("kpi-total").textContent = TODOS_ASESORES.length;
    document.getElementById("kpi-ciudad-lider").textContent = ciudadesOrdenadas.length ? ciudadesOrdenadas[0][0] : "—";
    document.getElementById("kpi-xp-prom").textContent = TODOS_ASESORES.length ? Math.round(xpTotal / TODOS_ASESORES.length) : 0;
    document.getElementById("kpi-modulos").textContent = modulosTotal;

    document.getElementById("lista-ciudades").innerHTML = ciudadesOrdenadas.length
      ? ciudadesOrdenadas.map(([ciudad, n], i) => `
        <div class="app-card" style="margin-top:10px;">
          <div class="app-row-between">
            <span style="font-weight:800; font-size:13.5px; color:var(--navy-950);">${ciudad}</span>
            <span class="app-muted" style="font-weight:700;">${n}</span>
          </div>
          <div class="app-progress-track" style="margin-top:10px;">
            <div class="app-progress-fill" style="width:${pct(n, max)}%; background:var(--${COLORES_BARRA[i % COLORES_BARRA.length]});"></div>
          </div>
        </div>`).join("")
      : `<p class="app-muted">Todavía no hay asesores registrados.</p>`;

    renderAsesores(TODOS_ASESORES);
    ocultarCargaVendedor();
  }catch(err){
    console.error(err);
    document.getElementById("resumen-total").textContent = "No se pudieron cargar las estadísticas.";
    ocultarCargaVendedor();
  }

  document.getElementById("buscar-asesor").addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    const filtrados = !q ? TODOS_ASESORES : TODOS_ASESORES.filter(v =>
      (v.nombre||"").toLowerCase().includes(q) || (v.ciudad||"").toLowerCase().includes(q));
    renderAsesores(filtrados, !!q);
  });
});

function renderAsesores(lista, esFiltro){
  const ordenados = [...lista].sort((a,b) => (b.xp||0) - (a.xp||0));
  document.getElementById("lista-asesores").innerHTML = ordenados.length
    ? ordenados.map((v,i) => `
      <div class="nivel-row">
        ${(!esFiltro && i < 3)
          ? `<div class="rank-medal ${MEDALLAS[i]}">${i+1}</div>`
          : `<div class="nivel-row-badge acc-teal-bg" style="width:40px;height:40px;font-size:13px;">${iniciales(v.nombre)}</div>`}
        <div style="flex:1;">
          <div style="font-weight:800; font-size:13px; color:var(--navy-950);">${v.nombre || "(sin nombre)"}</div>
          <div class="app-muted">${v.ciudad || "Sin ciudad"} · ${(v.completados||[]).length} módulos</div>
        </div>
        <div class="app-muted" style="font-weight:700;">${v.xp||0} XP</div>
      </div>`).join("")
    : `<p class="app-muted">Sin resultados.</p>`;
}
</script>
</body>
</html>
