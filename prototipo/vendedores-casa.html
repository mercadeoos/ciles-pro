<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23001489'/><text x='50' y='70' font-size='58' text-anchor='middle'>%E2%9A%A1</text></svg>">
<title>Mi casa CILES — CILES PRO Vendedores</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="vendedores">

<div class="phone-wrap">
<div class="phone-shell">
  <div class="phone-scroll" id="scroll">

    <div class="app-row" style="align-items:flex-start; gap:10px;">
      <div style="flex:1;">
        <span class="app-eyebrow">Gamificación</span>
        <h1 class="app-h1">Tu casa CILES</h1>
        <p class="app-lede">Breiki te acompaña: cada módulo que completas instala un producto real en tu casa virtual de vendedor.</p>
      </div>
      <img src="assets/img/breiki.png" alt="Breiki" class="mascot mascot-sm" style="flex-shrink:0;">
    </div>

    <div class="app-card casa-construccion" style="margin-top:18px;">
      <div id="casa-escena"></div>
      <p class="casa-construccion-etapa" id="casa-etapa"></p>
      <div class="progress-track" style="margin-top:8px;"><div class="progress-fill" id="casa-progreso-fill" style="width:0%;"></div></div>
      <p class="app-muted" id="casa-progreso-texto" style="margin-top:6px; text-align:center;"></p>
    </div>

    <div class="casa-grid-app" id="casa-grid" style="margin-top:18px;"></div>

    <div style="margin-top:24px;">
      <h2 class="app-h2">Elementos desbloqueados</h2>
      <div id="lista-desbloqueados" style="margin-top:10px;"></div>
    </div>

  </div>
  <div id="tabbar-slot"></div>
</div>
</div>

<script src="assets/js/data-vendedores.js"></script>
<script src="assets/js/iconos.js"></script>
<script src="assets/js/main.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-vendedor.js"></script>
<script src="assets/js/app-vendedor.js"></script>
<script>
const ROOM_VENDEDOR = {
  "0.1":"sala","0.2":"sala","0.3":"sala","0.4":"tablero","0.5":"sala","0.6":"tablero","0.7":"sala",
  "1.1":"sala","1.2":"cuarto","1.3":"cuarto","1.4":"sala","1.5":"bano","1.6":"exterior","1.7":"cocina",
  "1.8":"bano","1.9":"exterior","1.10":"cuarto","1.11":"sala","1.12":"sala",
  "2.1":"tablero","2.2":"tablero","2.3":"tablero","2.4":"tablero","2.5":"tablero","2.6":"tablero",
  "2.7":"tablero","2.8":"tablero","2.9":"tablero","2.10":"tablero","2.11":"tablero",
  "3.1":"exterior","3.2":"exterior","3.3":"exterior","3.4":"exterior",
  "4.1":"tablero","4.2":"tablero","4.3":"tablero","4.4":"tablero",
  "5.1":"sala","5.2":"sala","5.3":"sala","5.4":"sala",
};
const ROOM_LABEL = {sala:"Sala", cocina:"Cocina", tablero:"Tablero", bano:"Baño", cuarto:"Cuarto", exterior:"Exterior"};

const ETAPAS_CONSTRUCCION = [
  {umbral:0,  titulo:"Terreno listo",        texto:"Todavía no hay nada construido — completa tu primer módulo para arrancar la obra."},
  {umbral:1,  titulo:"Fundación en obra",     texto:"Se echaron las bases de tu casa CILES."},
  {umbral:8,  titulo:"Levantando paredes",    texto:"La estructura empieza a tomar forma."},
  {umbral:15, titulo:"Techo instalado",       texto:"Ya tiene techo — falta rematar los detalles."},
  {umbral:22, titulo:"Ventanas y puerta",     texto:"Se instalaron las ventanas y la puerta principal."},
  {umbral:29, titulo:"¡Casa terminada!",      texto:"Obra terminada y lista para mostrar."},
];

function etapaConstruccionPara(completados){
  let idx = 0;
  ETAPAS_CONSTRUCCION.forEach((e, i) => { if(completados >= e.umbral) idx = i; });
  return idx;
}

/* Escena SVG de la obra: cada etapa agrega elementos sobre la anterior
   (terreno → fundación → paredes → techo → ventanas/puerta → acabados). */
function escenaConstruccionSVG(etapa){
  const partes = [];
  partes.push(`
    <rect x="0" y="0" width="320" height="170" fill="var(--app-bg)"/>
    <circle cx="278" cy="34" r="17" fill="var(--acc-gold-soft)"/>
    <circle cx="278" cy="34" r="10" fill="var(--acc-gold)"/>
    <rect x="0" y="164" width="320" height="46" fill="var(--acc-teal-soft)"/>
  `);
  if(etapa < 5){
    partes.push(`<rect x="18" y="150" width="3" height="30" fill="#a9967f"/>
      <rect x="8" y="140" width="30" height="14" rx="2" fill="#fff" stroke="var(--navy-950)" stroke-width="1.5"/>`);
  }
  if(etapa === 0){
    partes.push(`<rect x="252" y="150" width="16" height="10" fill="var(--acc-coral)" rx="1"/><rect x="252" y="138" width="16" height="10" fill="var(--acc-coral)" rx="1"/>`);
  }
  if(etapa >= 1){
    partes.push(`<rect x="70" y="158" width="180" height="14" rx="2" fill="#c7c4bd"/>
      <line x1="90" y1="158" x2="90" y2="172" stroke="#aaa7a0" stroke-width="1"/>
      <line x1="140" y1="158" x2="140" y2="172" stroke="#aaa7a0" stroke-width="1"/>
      <line x1="190" y1="158" x2="190" y2="172" stroke="#aaa7a0" stroke-width="1"/>
      <line x1="230" y1="158" x2="230" y2="172" stroke="#aaa7a0" stroke-width="1"/>`);
  }
  if(etapa >= 2){
    const colorPuerta = etapa >= 4 ? "var(--orange-500)" : "var(--navy-950)";
    const colorVentana = etapa >= 4 ? "#bfe0f5" : "var(--navy-950)";
    partes.push(`<rect x="80" y="95" width="160" height="65" fill="#fbf8f2" stroke="var(--navy-950)" stroke-width="2"/>
      <rect x="100" y="112" width="26" height="26" fill="${colorVentana}" stroke="var(--navy-950)" stroke-width="1.5"/>
      <rect x="194" y="112" width="26" height="26" fill="${colorVentana}" stroke="var(--navy-950)" stroke-width="1.5"/>
      <rect x="148" y="128" width="24" height="32" fill="${colorPuerta}" stroke="var(--navy-950)" stroke-width="1.5"/>`);
    if(etapa >= 4){
      partes.push(`<line x1="113" y1="112" x2="113" y2="138" stroke="#fff" stroke-width="1.5"/>
        <line x1="100" y1="125" x2="126" y2="125" stroke="#fff" stroke-width="1.5"/>
        <line x1="207" y1="112" x2="207" y2="138" stroke="#fff" stroke-width="1.5"/>
        <line x1="194" y1="125" x2="220" y2="125" stroke="#fff" stroke-width="1.5"/>
        <circle cx="166" cy="146" r="1.8" fill="#fbf8f2"/>`);
    }
  }
  if(etapa >= 3){
    partes.push(`<polygon points="72,95 248,95 160,42" fill="var(--navy-950)"/>
      <rect x="196" y="48" width="14" height="34" fill="#c7c4bd"/>
      <rect x="194" y="44" width="18" height="7" fill="#aaa7a0"/>`);
  }
  if(etapa >= 5){
    partes.push(`<rect x="78" y="93" width="164" height="4" fill="var(--orange-500)"/>
      <path d="M148 160 L172 160 L184 174 L136 174 Z" fill="#e4e1d8"/>
      <circle cx="272" cy="150" r="14" fill="var(--acc-teal)"/>
      <circle cx="286" cy="158" r="9" fill="var(--acc-teal)"/>
      <polygon points="160,42 160,24 176,32" fill="var(--acc-coral)"/>
      <line x1="160" y1="42" x2="160" y2="22" stroke="var(--navy-950)" stroke-width="1.5"/>`);
  } else if(etapa >= 1){
    partes.push(`<rect x="252" y="150" width="16" height="10" fill="var(--acc-coral)" rx="1"/>`);
  }
  return `<svg viewBox="0 0 320 210" style="display:block; width:100%; height:auto; border-radius:16px; overflow:hidden;">${partes.join("")}</svg>`;
}

document.addEventListener("DOMContentLoaded", async () => {
  if(await requiereOnboardingVendedor()) return;
  document.getElementById("tabbar-slot").innerHTML = renderTabbarVendedor("casa");

  const e = getEstadoVendedor();
  const todos = todosModulosVendedor();
  const totalModulos = todos.length;
  const hechosCount = e.completados.length;

  const etapaIdx = etapaConstruccionPara(hechosCount);
  const etapa = ETAPAS_CONSTRUCCION[etapaIdx];
  document.getElementById("casa-escena").innerHTML = escenaConstruccionSVG(etapaIdx);
  document.getElementById("casa-etapa").innerHTML = `<strong>${etapa.titulo}</strong> — ${etapa.texto}`;
  const pct = Math.round((hechosCount / totalModulos) * 100);
  document.getElementById("casa-progreso-fill").style.width = pct + "%";
  document.getElementById("casa-progreso-texto").textContent = `${pct}% construida · ${hechosCount}/${totalModulos} módulos`;

  const grid = document.getElementById("casa-grid");
  grid.innerHTML = Object.keys(ROOM_LABEL).map(room => {
    const modsRoom = todos.filter(m => ROOM_VENDEDOR[m.id] === room);
    const hechos = modsRoom.filter(m => e.completados.includes(m.id));
    return `<div class="casa-slot-app ${hechos.length ? "unlocked" : ""}" style="grid-area:${room};">
      <div class="casa-room-label">${ROOM_LABEL[room]}</div>
      <div style="font-size:22px;">${hechos.length ? "⚡".repeat(Math.min(hechos.length,3)) : "—"}</div>
      <div class="app-muted">${hechos.length}/${modsRoom.length} instalados</div>
    </div>`;
  }).join("");

  const lista = document.getElementById("lista-desbloqueados");
  const hechos = todos.filter(m => e.completados.includes(m.id));
  if(!hechos.length){
    lista.innerHTML = `<div class="app-card"><p class="app-muted">Todavía no has desbloqueado nada. Completa tu primer módulo para empezar a construir tu casa CILES.</p>
      <a href="vendedores-home.html" class="app-btn app-btn-primary" style="margin-top:12px;">Ir a mi primer módulo →</a></div>`;
  } else {
    lista.innerHTML = hechos.map(m => `
      <div class="modulo-card done">
        <span class="blob-icon size-sm">${blobIcon(m.icono, m.nivelColor.replace("acc-",""))}</span>
        <div style="flex:1;">
          <div class="mc-title">${m.gamificacion.elemento}</div>
          <div class="mc-sub">${m.nombre} · ${ROOM_LABEL[ROOM_VENDEDOR[m.id]]}</div>
        </div>
        <div class="check">✓</div>
      </div>`).join("");
  }
});
</script>
</body>
</html>
